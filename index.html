<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f17">
<title>Ne Yapay? — AI & Topluluk Portalı</title>
<link rel="manifest" href="manifest.json">
<style>
:root {
  --bg: #0b0d14;
  --panel: #131722;
  --surface: #1a1f30;
  --surface-hover: #22293f;
  --border: #283048;
  --border-subtle: #1c2234;
  --text: #f0f2fa;
  --text-muted: #8e95ad;
  --text-sub: #606882;
  --accent: #ffb84d;
  --accent-glow: rgba(255, 184, 77, 0.25);
  --primary: #7c66dc;
  --primary-glow: rgba(124, 102, 220, 0.25);
  --success: #3dd68c;
  --danger: #ff5263;
  --danger-glow: rgba(255, 82, 99, 0.25);
  --warning: #ffa940;
  --radius: 14px;
  --radius-sm: 8px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;overflow-x:hidden}

/* Arka plan ışık efektleri */
.ambient {position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden}
.ambient-glow {position:absolute;border-radius:50%;filter:blur(90px);opacity:0.22}
.g1 {width:50vw;height:50vw;background:var(--primary);top:-15vw;left:-10vw;animation:orbit 24s ease-in-out infinite alternate}
.g2 {width:45vw;height:45vw;background:var(--accent);bottom:-10vw;right:-10vw;animation:orbit 28s ease-in-out infinite alternate-reverse}
@keyframes orbit {to{transform:translate(10vw, 8vw) scale(1.15)}}

/* Ana Taşıyıcı */
.app-container {max-width:1050px;margin:0 auto;padding:16px 14px 60px}

/* Üst Bar & Marka */
.header {display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:rgba(19,23,34,0.75);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;box-shadow:0 8px 30px rgba(0,0,0,0.35)}
.brand {display:flex;align-items:center;gap:12px}
.brand-icon {width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--primary));display:grid;place-items:center;font-weight:900;color:#0d0f17;font-size:1.3rem;box-shadow:0 4px 14px var(--accent-glow)}
.brand-text h1 {font-size:1.3rem;font-weight:800;letter-spacing:-0.03em;display:flex;align-items:center;gap:6px}
.brand-text span {color:var(--accent)}
.brand-text p {font-size:0.75rem;color:var(--text-muted)}
.header-actions {display:flex;align-items:center;gap:10px}

/* Kullanıcı Çipi */
.user-chip {display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border);padding:5px 12px 5px 6px;border-radius:30px}
.chip-av {width:30px;height:30px;border-radius:50%;object-fit:cover;display:grid;place-items:center;font-size:0.8rem;font-weight:800;color:#10121a}
.chip-name {font-size:0.85rem;font-weight:600;max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge-admin {background:var(--accent);color:#1a1300;font-size:0.65rem;font-weight:800;padding:2px 7px;border-radius:6px;text-transform:uppercase;letter-spacing:0.04em}

/* Global Duyuru Şeridi */
.banner-alert {display:none;background:linear-gradient(90deg,rgba(255,184,77,0.15),rgba(124,102,220,0.15));border:1px solid var(--accent);color:var(--text);padding:10px 16px;border-radius:var(--radius-sm);margin-bottom:14px;font-size:0.88rem;align-items:center;gap:10px;animation:slideDown .3s ease}
.banner-alert.active {display:flex}
.banner-icon {font-size:1.1rem;color:var(--accent)}

/* Sekmeler (Tabs) */
.tabs {display:flex;gap:8px;background:var(--panel);border:1px solid var(--border);padding:6px;border-radius:var(--radius);margin-bottom:18px;overflow-x:auto}
.tab-btn {flex:1;min-width:max-content;background:transparent;border:0;color:var(--text-muted);padding:10px 16px;border-radius:var(--radius-sm);font-weight:700;font-size:0.9rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s ease}
.tab-btn:hover {color:var(--text);background:rgba(255,255,255,0.03)}
.tab-btn.active {background:var(--surface);color:var(--accent);border:1px solid var(--border);box-shadow:0 4px 14px rgba(0,0,0,0.25)}
.tab-btn .badge-count {background:var(--danger);color:#fff;font-size:0.7rem;padding:2px 6px;border-radius:10px;font-weight:800}

/* Genel Buton ve Giriş Elemanları */
button {font:inherit;cursor:pointer;border:0;border-radius:var(--radius-sm);transition:all .18s ease}
button:active {transform:scale(0.97)}
.btn-primary {background:var(--accent);color:#181200;font-weight:700;padding:10px 16px;box-shadow:0 4px 14px var(--accent-glow)}
.btn-primary:hover {transform:translateY(-1px);box-shadow:0 6px 18px var(--accent-glow)}
.btn-primary:disabled {opacity:0.5;cursor:not-allowed;transform:none}
.btn-ghost {background:var(--surface);color:var(--text);border:1px solid var(--border);padding:8px 14px;font-weight:600}
.btn-ghost:hover {background:var(--surface-hover);border-color:var(--accent)}
.btn-danger {background:rgba(255,82,99,0.15);color:var(--danger);border:1px solid rgba(255,82,99,0.3);padding:8px 12px;font-weight:600}
.btn-danger:hover {background:var(--danger);color:#fff}
.btn-sm {padding:6px 10px;font-size:0.8rem;border-radius:6px}

input,textarea,select {font:inherit;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;transition:border-color .2s}
input:focus,textarea:focus,select:focus {outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}

/* Toast Bildirim */
#toast {position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--panel);border:1px solid var(--border);color:var(--text);padding:12px 22px;border-radius:30px;font-size:0.9rem;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,0.5);display:flex;align-items:center;gap:10px;z-index:9999;transition:transform .3s cubic-bezier(0.18, 0.89, 0.32, 1.28);pointer-events:none}
#toast.show {transform:translateX(-50%) translateY(0)}

/* Modal / Diyalog Kutusu */
.modal-overlay {position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(6px);display:none;place-items:center;z-index:10000;padding:16px}
.modal-overlay.active {display:grid}
.modal-card {background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);width:100%;max-width:440px;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,0.6);animation:slideDown .25s ease}

/* Kartlar ve Mesajlaşma */
.ai-card {background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:0 12px 36px rgba(0,0,0,0.25)}
.ai-topbar {display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border-subtle)}
.model-select {display:flex;align-items:center;gap:8px}
.quota-badge {font-size:0.82rem;color:var(--text-muted);background:var(--surface);padding:6px 12px;border-radius:20px;border:1px solid var(--border)}

.chat-box {height:58vh;overflow-y:auto;padding-right:6px;display:flex;flex-direction:column;gap:14px;margin-bottom:14px;scroll-behavior:smooth}
.msg-wrap {display:flex;gap:10px;max-width:85%;animation:fadeIn .25s ease both}
.msg-wrap.me {align-self:flex-end;flex-direction:row-reverse}
.msg-wrap.ai-bot {align-self:flex-start}
.msg-av {width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:0.85rem;font-weight:800;flex-shrink:0;color:#0d0f17}
.msg-bubble {padding:12px 16px;border-radius:14px;font-size:0.93rem;line-height:1.5;white-space:pre-wrap;word-break:break-word;position:relative}
.msg-wrap.me .msg-bubble {background:linear-gradient(135deg,#5e4cc4,#47389a);color:#fff;border-bottom-right-radius:3px}
.msg-wrap:not(.me):not(.ai-bot) .msg-bubble {background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:3px}
.msg-wrap.ai-bot .msg-bubble {background:rgba(255,184,77,0.08);border:1px solid rgba(255,184,77,0.35);border-bottom-left-radius:3px}
.msg-meta {font-size:0.72rem;color:var(--text-sub);margin-bottom:4px;display:flex;justify-content:space-between;gap:8px}

.input-bar {display:flex;gap:10px;align-items:flex-end}
.input-bar textarea {flex:1;resize:none;max-height:120px;border-radius:var(--radius-sm)}

/* Sohbet Kilit Çubuğu */
.chat-locked-bar {background:rgba(255,82,99,0.12);border:1px solid var(--danger);color:var(--danger);padding:10px;border-radius:var(--radius-sm);text-align:center;font-size:0.88rem;font-weight:600;margin-bottom:12px;display:none}
.chat-locked-bar.active {display:block}

/* Admin Paneli */
.admin-badge-strip {background:linear-gradient(90deg,rgba(255,184,77,0.1),rgba(124,102,220,0.1));border:1px solid var(--accent);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;font-size:0.85rem}
.admin-subnav {display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px}
.subnav-btn {background:var(--surface);color:var(--text-muted);border:1px solid var(--border);padding:8px 14px;border-radius:var(--radius-sm);font-size:0.84rem;font-weight:600;cursor:pointer}
.subnav-btn.active {background:var(--accent);color:#181200;border-color:var(--accent)}

.stats-grid {display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px}
.stat-card {background:var(--panel);border:1px solid var(--border);padding:16px;border-radius:var(--radius);display:flex;flex-direction:column;gap:6px}
.stat-card .val {font-size:1.8rem;font-weight:800;color:var(--text)}
.stat-card .lbl {font-size:0.78rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em}

.data-table-wrap {background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:16px}
.table-header {padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:10px}
.table-header h3 {font-size:1.05rem;font-weight:700}
.list-item {display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--border-subtle);gap:12px;transition:background .15s}
.list-item:hover {background:rgba(255,255,255,0.02)}
.list-item:last-child {border-bottom:none}
.item-info {display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.item-info b {display:block;font-size:0.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-info small {color:var(--text-muted);font-size:0.78rem}
.item-actions {display:flex;gap:6px;flex-shrink:0}

/* Rozetler */
.badge {font-size:0.7rem;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase}
.badge-banned {background:rgba(255,82,99,0.2);color:var(--danger);border:1px solid var(--danger)}
.badge-muted {background:rgba(255,169,64,0.2);color:var(--warning);border:1px solid var(--warning)}
.badge-ok {background:rgba(61,214,140,0.15);color:var(--success);border:1px solid var(--success)}
.badge-bonus {background:rgba(124,102,220,0.2);color:#b3a2ff;border:1px solid var(--primary)}
.badge-flagged {background:rgba(255,82,99,0.25);color:var(--danger);border:1px solid var(--danger);font-weight:800}

/* Switch */
.switch {position:relative;display:inline-block;width:44px;height:24px}
.switch input {opacity:0;width:0;height:0}
.slider {position:absolute;cursor:pointer;inset:0;background-color:var(--surface);border:1px solid var(--border);border-radius:24px;transition:.25s}
.slider:before {position:absolute;content:"";height:16px;width:16px;left:3px;bottom:3px;background-color:var(--text-muted);border-radius:50%;transition:.25s}
input:checked + .slider {background-color:var(--accent);border-color:var(--accent)}
input:checked + .slider:before {transform:translateX(20px);background-color:#181200}

/* Giriş Ekranı */
.auth-center {min-height:85vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.auth-box {width:100%;max-width:380px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:30px 24px;box-shadow:0 16px 40px rgba(0,0,0,0.5)}
.auth-title {font-size:2.2rem;font-weight:900;letter-spacing:-0.03em;margin-bottom:8px}
.auth-title span {color:var(--accent)}
.auth-desc {color:var(--text-muted);font-size:0.9rem;margin-bottom:24px}

@keyframes fadeIn {from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideDown {from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<div class="ambient">
  <div class="ambient-glow g1"></div>
  <div class="ambient-glow g2"></div>
</div>

<div id="toast"></div>

<!-- Kredi Verme Modalı -->
<div class="modal-overlay" id="credit-modal">
  <div class="modal-card">
    <h3 style="margin-bottom:8px">🎁 Kullanıcıya Ekstra Kredi Tanımla</h3>
    <p style="font-size:0.85rem;color:var(--text-muted);margin-bottom:16px" id="modal-user-target">Kullanıcı seçiliyor...</p>
    
    <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:18px">
      <div>
        <label style="font-size:0.8rem;color:var(--text-muted);display:block;margin-bottom:4px">Standart Model Ekstra Hak:</label>
        <input type="number" id="input-bonus-free" min="0" placeholder="Örn: 20" style="width:100%">
      </div>
      <div>
        <label style="font-size:0.8rem;color:var(--text-muted);display:block;margin-bottom:4px">Pro Model Ekstra Hak:</label>
        <input type="number" id="input-bonus-pro" min="0" placeholder="Örn: 5" style="width:100%">
      </div>
    </div>

    <div style="display:flex;justify-content:flex-end;gap:10px">
      <button class="btn-ghost" id="btn-cancel-modal">İptal</button>
      <button class="btn-primary" id="btn-save-credits">Kredileri Kaydet</button>
    </div>
  </div>
</div>

<div id="app" class="app-container">
  <div class="auth-center"><div class="auth-desc">Yükleniyor…</div></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getDatabase, ref, get, set, update, remove, onValue, push, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const cfg = {
  apiKey: "AIzaSyAOA_EKD-uJQrQWxVO1zlVTrgxBbcCpKug",
  authDomain: "ne-yapay.firebaseapp.com",
  projectId: "ne-yapay",
  storageBucket: "ne-yapay.firebasestorage.app",
  messagingSenderId: "391460522060",
  appId: "1:391460522060:web:d8089bfcc5be0c6eba4ce9",
  databaseURL: "https://ne-yapay-default-rtdb.europe-west1.firebasedatabase.app"
};
const WORKER = "https://neyapay.hafizselmankusutoglu@workers.dev";
const ADMIN_EMAIL = "hafizselmankusutoglu@gmail.com";
const DEFAULT_LIMITS = { freeDaily: 30, proDaily: 4, maxChars: 500 };

const auth = getAuth(initializeApp(cfg));
const db = getDatabase();
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const app = $("#app");

let unsubs = [];
const clean = () => { unsubs.forEach(u => typeof u === "function" && u()); unsubs = []; };

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

function showToast(msg, dur = 2800) {
  const t = $("#toast");
  if (!t) return;
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), dur);
}

const av = (uid, name, pp) => pp
  ? `<img class="chip-av" src="${esc(pp)}" alt="av">`
  : `<div class="chip-av" style="background:hsl(${[...uid].reduce((a,c)=>a+c.charCodeAt(0),0)%360} 70% 65%)">${esc((name||"?")[0].toUpperCase())}</div>`;

let currentUser = null;
let isAdmin = false;
let userProfiles = {};
let myBonusCredits = { free: 0, pro: 0 };
let appSettings = {
  chatLocked: false,
  slowmode: 0,
  announcement: "",
  badWords: [],
  watchWords: [],
  models: { free: true, pro: true }
};

// ----------------- GİRİŞ & YETKİLENDİRME -----------------
function renderLogin(err = "") {
  clean();
  app.innerHTML = `
    <div class="auth-center">
      <div class="auth-box">
        <div class="auth-title">Ne <span>Yapay?</span></div>
        <p class="auth-desc">Kapalı devre yapay zeka & topluluk ağına hoş geldin.</p>
        <button class="btn-primary" style="width:100%;margin-bottom:12px" id="btn-login">Google ile Giriş Yap</button>
        ${err ? `<p style="color:var(--danger);font-size:0.85rem;margin-top:10px">${esc(err)}</p>` : ""}
      </div>
    </div>
  `;
  $("#btn-login").onclick = () => {
    signInWithPopup(auth, new GoogleAuthProvider()).catch(e => renderLogin("Giriş başarısız (" + e.code + ")"));
  };
}

function renderInvite(u) {
  clean();
  app.innerHTML = `
    <div class="auth-center">
      <div class="auth-box">
        <div class="auth-title">Davet <span>Kodu</span></div>
        <p class="auth-desc">Bu platform yalnızca özel davetiyeyle çalışır. Sana verilen 10 haneli kodu gir.</p>
        <input id="inv-code" placeholder="Örn: 9X7K2M4P" maxlength="16" style="width:100%;text-align:center;text-transform:uppercase;letter-spacing:0.2em;font-weight:700;margin-bottom:12px">
        <button class="btn-primary" style="width:100%;margin-bottom:12px" id="btn-check-code">Kodu Onayla ve Başla</button>
        <div id="inv-err" style="color:var(--danger);font-size:0.85rem;min-height:1.2em"></div>
        <button class="btn-ghost btn-sm" style="width:100%;margin-top:10px" id="btn-logout-inv">Çıkış Yap</button>
      </div>
    </div>
  `;
  $("#btn-logout-inv").onclick = () => signOut(auth);
  $("#btn-check-code").onclick = async () => {
    const code = $("#inv-code").value.trim().toUpperCase();
    if (!code) return;
    try {
      const snap = await get(ref(db, "codes/" + code));
      if (!snap.exists() || snap.val().used) {
        $("#inv-err").textContent = "Bu kod geçersiz ya da daha önce kullanılmış.";
        return;
      }
      await update(ref(db), {
        [`codes/${code}/used`]: true,
        [`codes/${code}/usedBy`]: u.uid,
        [`codes/${code}/usedAt`]: Date.now(),
        [`users/${u.uid}`]: {
          email: u.email,
          name: u.displayName || u.email.split("@")[0],
          banned: false,
          mutedUntil: 0,
          bonusCredits: { free: 0, pro: 0 },
          code: code,
          createdAt: Date.now()
        }
      });
      initAppShell(u, false);
    } catch (e) {
      $("#inv-err").textContent = "Bağlantı hatası oluştu.";
    }
  };
}

function renderBanned() {
  clean();
  app.innerHTML = `
    <div class="auth-center">
      <div class="auth-box">
        <div class="auth-title" style="color:var(--danger)">Erişim <span>Engellendi</span></div>
        <p class="auth-desc">Topluluk kurallarını ihlal ettiğin için bu hesaba erişim yönetici tarafından durdurulmuştur.</p>
        <button class="btn-ghost" style="width:100%" id="btn-banned-out">Çıkış Yap</button>
      </div>
    </div>
  `;
  $("#btn-banned-out").onclick = () => signOut(auth);
}

// ----------------- ANA UYGULAMA İSKELETİ -----------------
function initAppShell(u, admin) {
  clean();
  currentUser = u;
  isAdmin = admin;

  update(ref(db, `profiles/${u.uid}`), {
    name: (u.displayName || u.email.split("@")[0]).slice(0, 40)
  });

  // Kullanıcının kendi hediye kredisini dinle
  unsubs.push(onValue(ref(db, `users/${u.uid}/bonusCredits`), snap => {
    myBonusCredits = snap.val() || { free: 0, pro: 0 };
    refreshAiQuotaDisplay();
  }));

  // Genel ayarları dinle
  unsubs.push(onValue(ref(db, "settings/global"), snap => {
    const data = snap.val() || {};
    appSettings.chatLocked = !!data.chatLocked;
    appSettings.slowmode = Number(data.slowmode || 0);
    appSettings.announcement = data.announcement || "";
    appSettings.badWords = Array.isArray(data.badWords) ? data.badWords : [];
    appSettings.watchWords = Array.isArray(data.watchWords) ? data.watchWords : [];
    appSettings.models = data.models || { free: true, pro: true };
    updateAnnouncementUI();
  }));

  unsubs.push(onValue(ref(db, "profiles"), snap => {
    userProfiles = snap.val() || {};
  }));

  const navItems = [
    { id: "ai", label: "🤖 AI Asistan" },
    { id: "chat", label: "💬 Genel Sohbet & AI" },
    { id: "me", label: "👤 Profilim" }
  ];
  if (isAdmin) {

// ----------------- VİEW 2: GENEL SOHBET & ORTAK AI -----------------
let lastMsgTime = 0;
let groupAiBusy = false;

function filterBadWords(t) {
  let res = t;
  const list = appSettings.badWords || [];
  list.forEach(w => {
    if (!w) return;
    const reg = new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
    res = res.replace(reg, "***");
  });
  return res;
}

function renderChatView() {
  const c = $("#tab-content");
  c.innerHTML = `
    <div class="ai-card">
      <div class="ai-topbar" style="margin-bottom:10px">
        <div style="font-size:0.88rem;color:var(--text-muted)">
          💡 <b>Ortak Yapay Zeka:</b> Mesajında <code style="color:var(--accent);font-weight:700">@ai</code> etiketi kullanırsan yapay zeka sohbete doğrudan katılıp yanıt verir!
        </div>
        <button class="btn-ghost btn-sm" id="btn-quick-ai">🤖 @ai'ya Sor</button>
      </div>

      <div class="chat-locked-bar ${appSettings.chatLocked && !isAdmin ? 'active' : ''}" id="chat-lock-msg">
        🔒 Sohbet şu anda yönetici tarafından geçici olarak kilitlenmiştir.
      </div>

      <div class="chat-box" id="group-chat-box" style="height:60vh"></div>

      <div class="input-bar">
        <textarea id="group-input" rows="1" maxlength="300" placeholder="Topluluğa yaz veya @ai ile yapay zekaya sor..."></textarea>
        <button class="btn-primary" id="btn-send-group">Gönder</button>
      </div>
      <div id="slowmode-hint" style="font-size:0.75rem;color:var(--text-sub);margin-top:6px"></div>
    </div>
  `;

  $("#btn-quick-ai").onclick = () => {
    const input = $("#group-input");
    input.value = "@ai " + input.value.replace(/^@ai\s*/i, "");
    input.focus();
  };

  let messages = [];
  const drawChat = () => {
    const box = $("#group-chat-box");
    if (!box) return;
    box.innerHTML = messages.map(([id, m]) => {
      const isMe = m.uid === currentUser.uid;
      const isAi = !!m.isAi;
      const userPic = isAi ? null : userProfiles[m.uid]?.pp;
      return `
        <div class="msg-wrap ${isMe ? 'me' : ''} ${isAi ? 'ai-bot' : ''}">
          ${isAi ? `<div class="msg-av" style="background:var(--accent)">🤖</div>` : av(m.uid, m.name, userPic)}
          <div class="msg-bubble">
            <div class="msg-meta">
              <b>${esc(m.name)} ${isAi ? '<span class="badge" style="background:var(--accent);color:#10121a">Bot</span>' : ''}</b>
              <span>${new Date(m.ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span>
            </div>
            <div>${esc(m.text)}</div>
            ${isAdmin ? `
              <div style="margin-top:8px;border-top:1px solid var(--border-subtle);padding-top:4px;display:flex;gap:6px">
                <button class="btn-danger btn-sm" data-del-msg="${id}">Mesajı Sil</button>
                ${!isAi ? `<button class="btn-ghost btn-sm" data-purge-user="${m.uid}" style="font-size:0.75rem">Tümünü Sil</button>` : ''}
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }).join("");
    box.scrollTop = box.scrollHeight;

    if (isAdmin) {
      $$("[data-del-msg]").forEach(b => b.onclick = () => remove(ref(db, "chat/" + b.dataset.delMsg)));
      $$("[data-purge-user]").forEach(b => b.onclick = async () => {
        if (!confirm("Bu kullanıcının attığı tüm mesajları silmek istediğine emin misin?")) return;
        const uid = b.dataset.purgeUser;
        const snap = await get(ref(db, "chat"));
        const all = snap.val() || {};
        const updates = {};
        Object.entries(all).forEach(([mid, msg]) => {
          if (msg.uid === uid) updates[`chat/${mid}`] = null;
        });
        await update(ref(db), updates);
        showToast("Kullanıcının mesajları temizlendi.");
      });
    }
  };

  unsubs.push(onValue(query(ref(db, "chat"), limitToLast(120)), snap => {
    messages = Object.entries(snap.val() || {});
    drawChat();
  }));

  const sendGroup = async () => {
    if (appSettings.chatLocked && !isAdmin) {
      showToast("Sohbet şu anda kilitli.");
      return;
    }

    const userSnap = await get(ref(db, "users/" + currentUser.uid));
    const userData = userSnap.val() || {};
    if (userData.mutedUntil && userData.mutedUntil > Date.now()) {
      const remainingMin = Math.ceil((userData.mutedUntil - Date.now()) / 60000);
      showToast(`Susturuldunuz! Kalan süre: ${remainingMin} dakika.`);
      return;
    }

    const now = Date.now();
    const interval = (appSettings.slowmode || 0) * 1000;
    if (!isAdmin && now - lastMsgTime < Math.max(interval, 2000)) {
      const waitSec = Math.ceil((Math.max(interval, 2000) - (now - lastMsgTime)) / 1000);
      showToast(`Lütfen ${waitSec} saniye bekleyin.`);
      return;
    }

    const input = $("#group-input");
    const rawText = input.value.trim();
    if (!rawText) return;

    const filtered = filterBadWords(rawText);
    lastMsgTime = now;
    input.value = "";

    // 1. Kullanıcının mesajını gruba gönder
    await push(ref(db, "chat"), {
      uid: currentUser.uid,
      name: (userProfiles[currentUser.uid]?.name || currentUser.displayName || "Kullanıcı").slice(0, 40),
      text: filtered,
      ts: now
    });

    // 2. @ai Etiketi Var mı? (Ortak Yapay Zeka Çağrısı)
    if (/\b@ai\b/i.test(filtered) || /\b@yapay\b/i.test(filtered)) {
      if (groupAiBusy) return;
      groupAiBusy = true;
      const question = filtered.replace(/@ai|@yapay/gi, "").trim();

      // Geçici düşünme mesajı
      const tempRef = await push(ref(db, "chat"), {
        uid: "system_ai",
        isAi: true,
        name: "Ne Yapay (AI)",
        text: "Grup sorusunu düşünüyor… 💭",
        ts: Date.now()
      });

      try {
        const token = await currentUser.getIdToken();
        const res = await fetch(WORKER, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
          body: JSON.stringify({
            tier: "free",
            isGroup: true,
            messages: [{ role: "user", content: question || "Merhaba" }]
          })
        });
        const d = await res.json();
        const reply = d.reply || "Üzgünüm, şu anda yanıt üretemedim.";
        await update(ref(db, `chat/${tempRef.key}`), { text: reply });
      } catch {
        await update(ref(db, `chat/${tempRef.key}`), { text: "⚠ AI sunucusuna ulaşılamadı." });
      }
      groupAiBusy = false;
    }
  };

  $("#btn-send-group").onclick = sendGroup;
  $("#group-input").onkeydown = e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendGroup();
    }
  };
}

      ? `<img src="${esc(pp)}" style="width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid var(--accent)">`

    if (!stBox) return;
    if (snap.exists()) {
      stBox.innerHTML = `⏳ <b style="color:var(--warning)">Fotoğraf Onayda:</b> Yüklediğin fotoğraf yönetici onayından sonra toplulukta yayınlanacaktır.`;
    } else {
      stBox.innerHTML = `Fotoğrafını değiştirdiğinde troll veya uygunsuz görselleri önlemek için yönetici onayından geçer.`;
    }
  }));

  $("#btn-pick-avatar").onclick = () => $("#avatar-file-input").click();
  $("#avatar-file-input").onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = 160;
      const minDim = Math.min(img.width, img.height);
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, (img.width - minDim) / 2, (img.height - minDim) / 2, minDim, minDim, 0, 0, 160, 160);
      const b64 = canvas.toDataURL("image/jpeg", 0.78);
      set(ref(db, "pending/" + currentUser.uid), b64);
      showToast("Fotoğraf yönetici onayına gönderildi!");
    };
    img.src = URL.createObjectURL(file);
  };
}

    const val = input.value.trim().toLowerCase();
    if (!val) return;
    const words = appSettings.watchWords || [];
    if (!words.includes(val)) {
      words.push(val);
      set(ref(db, "settings/global/watchWords"), words);
    }
    input.value = "";
    drawWatchWords();
  };

  // Logları Çiz
  let onlyFlagged = false;
  let allLogs = [];

  const drawLogs = () => {
    const list = $("#ai-logs-list");
    if (!list) return;

    const filtered = onlyFlagged ? allLogs.filter(([_, l]) => l.flagged) : allLogs;
    if (!filtered.length) {
      list.innerHTML = `<div style="padding:24px;text-align:center;color:var(--text-sub)">Henüz kaydedilmiş log bulunmuyor.</div>`;
      return;
    }

    list.innerHTML = filtered.map(([id, l]) => `
      <div class="list-item" style="align-items:flex-start;${l.flagged ? 'background:rgba(255,82,99,0.06);border-left:4px solid var(--danger)' : ''}">
        <div style="flex:1">
          <div style="display:flex;justify-content:space-between;margin-bottom:6px">
            <div>
              <b>${esc(l.name || l.email)}</b>
              <small>${esc(l.email)} · ${new Date(l.ts).toLocaleString()} · ${l.isGroup ? '<b style="color:var(--accent)">Grup AI</b>' : 'Özel AI'}</small>
            </div>
            <div>
              ${l.flagged ? `<span class="badge badge-flagged">🚨 ALARM: ${esc(l.triggeredWord)}</span>` : `<span class="badge badge-ok">Temiz</span>`}
            </div>
          </div>
          <div style="background:var(--surface);padding:8px 12px;border-radius:var(--radius-sm);font-size:0.88rem;margin-bottom:6px;border:1px solid var(--border)">
            <b style="color:var(--text-muted);font-size:0.75rem;text-transform:uppercase">Kullanıcının Yazdığı:</b><br>
            ${esc(l.prompt)}
          </div>
          <div style="font-size:0.8rem;color:var(--text-muted)">
            <b>AI Yanıtı (Özet):</b> ${esc(l.replySnippet || "")}
          </div>
        </div>
        <div class="item-actions" style="margin-left:12px">
          <button class="btn-danger btn-sm" data-quick-ban="${l.uid}">Banla</button>
        </div>
      </div>
    `).join("");

    $$("[data-quick-ban]").forEach(b => b.onclick = () => {
      const uid = b.dataset.quickBan;
      if (!confirm("Bu kullanıcıyı banlamak istediğine emin misin?")) return;
      update(ref(db, "users/" + uid), { banned: true });
      showToast("Kullanıcı banlandı!");
    });
  };

  unsubs.push(onValue(query(ref(db, "logs/ai"), limitToLast(80)), snap => {
    allLogs = Object.entries(snap.val() || {}).sort((a,b) => b[1].ts - a[1].ts);
    drawLogs();
  }));

  $("#btn-filter-flagged").onclick = () => {
    onlyFlagged = !onlyFlagged;
    $("#btn-filter-flagged").textContent = onlyFlagged ? "Tüm Logları Göster" : "Yalnızca Alarmları Göster";
    drawLogs();
  };

  $("#btn-clear-logs").onclick = async () => {
    if (!confirm("Tüm logları silmek istediğine emin misin?")) return;
    await remove(ref(db, "logs/ai"));
    showToast("Loglar temizlendi.");
  };
}

// 4.2. Kullanıcı Masası (Kredi Verme + Ban + Susturma)
let targetCreditUid = null;

function renderAdminUsers() {
  const c = $("#admin-sub-content");
  c.innerHTML = `
    <div class="data-table-wrap">
      <div class="table-header">
        <h3>Kayıtlı Kullanıcılar & Kredi Tanımlama</h3>
        <input id="search-users" placeholder="İsim veya e-posta ara..." style="max-width:240px;padding:6px 12px;font-size:0.85rem">
      </div>
      <div id="users-table-list"></div>
    </div>
  `;

  let users = [];
  const drawUsers = (filter = "") => {
    const list = $("#users-table-list");
    if (!list) return;

    const filtered = users.filter(([id, u]) => {
      const q = filter.toLowerCase();
      return (u.name || "").toLowerCase().includes(q) || (u.email || "").toLowerCase().includes(q);
    });

    list.innerHTML = filtered.map(([id, u]) => {
      const isMuted = u.mutedUntil && u.mutedUntil > Date.now();
      const userPic = userProfiles[id]?.pp;
      const bFree = u.bonusCredits?.free || 0;
      const bPro = u.bonusCredits?.pro || 0;
      return `
        <div class="list-item">
          <div class="item-info">
            ${av(id, u.name, userPic)}
            <div>
              <b>${esc(u.name || "İsimsiz")} ${u.banned ? `<span class="badge badge-banned">Banlı</span>` : ''} ${isMuted ? `<span class="badge badge-muted">Susturuldu</span>` : ''}</b>
              <small>${esc(u.email)} · Kod: ${esc(u.code || "-")}</small>
              <div style="margin-top:3px">
                <span class="badge badge-bonus">Ekstra Hak: +${bFree} Free · +${bPro} Pro</span>
              </div>
            </div>
          </div>
          <div class="item-actions">
            <button class="btn-ghost btn-sm" data-grant-credit="${id}" style="color:var(--accent);border-color:var(--accent)">
              🎁 Kredi Ver
            </button>
            <button class="btn-ghost btn-sm" data-mute-user="${id}" data-muted="${isMuted ? 1 : 0}">
              ${isMuted ? "Susturmayı Aç" : "1 Sa Sustur"}
            </button>
            <button class="${u.banned ? 'btn-ghost' : 'btn-danger'} btn-sm" data-ban-user="${id}" data-banned="${u.banned ? 1 : 0}">
              ${u.banned ? "Banı Kaldır" : "Banla"}
            </button>
          </div>
        </div>
      `;
    }).join("") || `<div style="padding:20px;text-align:center;color:var(--text-sub)">Kullanıcı bulunamadı.</div>`;

    // Kredi Modalı Açma
    $$("[data-grant-credit]").forEach(b => b.onclick = () => {
      const uid = b.dataset.grantCredit;
      const u = users.find(x => x[0] === uid)?.[1];
      targetCreditUid = uid;
      $("#modal-user-target").textContent = `${u.name || u.email} (${u.email})`;
      $("#input-bonus-free").value = u.bonusCredits?.free || 0;
      $("#input-bonus-pro").value = u.bonusCredits?.pro || 0;
      $("#credit-modal").classList.add("active");
    });

    $$("[data-ban-user]").forEach(b => b.onclick = () => {
      const uid = b.dataset.banUser;
      const willBan = b.dataset.banned !== "1";
      update(ref(db, "users/" + uid), { banned: willBan });
      showToast(willBan ? "Kullanıcı banlandı!" : "Kullanıcının banı kaldırıldı!");
    });

    $$("[data-mute-user]").forEach(b => b.onclick = () => {
      const uid = b.dataset.muteUser;
      const isMuted = b.dataset.muted === "1";
      const mutedUntil = isMuted ? 0 : (Date.now() + 3600 * 1000);
      update(ref(db, "users/" + uid), { mutedUntil });
      showToast(isMuted ? "Susturma kaldırıldı." : "Kullanıcı 1 saat susturuldu.");
    });
  };

  unsubs.push(onValue(ref(db, "users"), snap => {
    users = Object.entries(snap.val() || {}).sort((a,b) => (b[1].createdAt||0) - (a[1].createdAt||0));
    drawUsers($("#search-users")?.value || "");
  }));

  $("#search-users").oninput = e => drawUsers(e.target.value);
}

// Modal Kapatma & Kaydetme
$("#btn-cancel-modal").onclick = () => $("#credit-modal").classList.remove("active");
$("#btn-save-credits").onclick = async () => {
  if (!targetCreditUid) return;
  const freeVal = parseInt($("#input-bonus-free").value) || 0;
  const proVal = parseInt($("#input-bonus-pro").value) || 0;

  await update(ref(db, `users/${targetCreditUid}/bonusCredits`), {
    free: Math.max(0, freeVal),
    pro: Math.max(0, proVal)
  });

  $("#credit-modal").classList.remove("active");
  showToast("Kullanıcı kredileri başarıyla güncellendi!");
};

// 4.5. Davet Kodları Masası
function renderAdminCodes() {
  const c = $("#admin-sub-content");
  c.innerHTML = `
    <div class="data-table-wrap" style="padding:18px;margin-bottom:16px">
      <h3 style="margin-bottom:12px">🎟️ Yeni Davet Kodu Üret</h3>
      <div style="display:flex;flex-wrap:wrap;gap:10px">
        <button class="btn-primary" id="btn-gen-single">1 Adet Kod Üret</button>
        <button class="btn-ghost" id="btn-gen-5">5 Adet Kod Paketi Üret</button>
        <button class="btn-ghost" id="btn-copy-unused">Kullanılmayan Kodları Kopyala</button>
      </div>
    </div>

    <div class="data-table-wrap">
      <div class="table-header">
        <h3>Mevcut Davet Kodları</h3>
      </div>
      <div id="codes-table-list"></div>
    </div>
  `;

  const makeCode = () => {
    const chars = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
    return [...crypto.getRandomValues(new Uint8Array(10))].map(x => chars[x % chars.length]).join("");
  };

  $("#btn-gen-single").onclick = () => {
    const c = makeCode();
    set(ref(db, "codes/" + c), { used: false, usedBy: "", createdAt: Date.now() });
    showToast("Kod üretildi: " + c);
  };

  $("#btn-gen-5").onclick = () => {
    const updates = {};
    for (let i = 0; i < 5; i++) {
      const c = makeCode();
      updates["codes/" + c] = { used: false, usedBy: "", createdAt: Date.now() };
    }
    update(ref(db), updates);
    showToast("5 adet yeni kod başarıyla üretildi.");
  };

  let cachedCodes = [];
  unsubs.push(onValue(ref(db, "codes"), snap => {
    const list = $("#codes-table-list");
    if (!list) return;
    cachedCodes = Object.entries(snap.val() || {}).sort((a,b) => b[1].createdAt - a[1].createdAt);

    list.innerHTML = cachedCodes.map(([code, d]) => `
      <div class="list-item">
        <div class="item-info">
          <div style="font-family:monospace;font-size:1.1rem;font-weight:800;letter-spacing:0.1em;color:var(--accent)">${esc(code)}</div>
          <div>
            ${d.used ? `<span class="badge" style="background:var(--surface)">Kullanıldı (${esc(userProfiles[d.usedBy]?.name || d.usedBy)})</span>` : `<span class="badge badge-ok">Kullanılabilir</span>`}
          </div>
        </div>
        <div class="item-actions">
          <button class="btn-ghost btn-sm" data-copy-c="${esc(code)}">Kopyala</button>
          <button class="btn-danger btn-sm" data-del-c="${esc(code)}">Sil</button>
        </div>
      </div>
    `).join("") || `<div style="padding:20px;text-align:center;color:var(--text-sub)">Henüz kod üretilmedi.</div>`;

    $$("[data-copy-c]").forEach(b => b.onclick = () => {
      navigator.clipboard.writeText(b.dataset.copyC);
      showToast("Kod panoya kopyalandı!");
    });
    $$("[data-del-c]").forEach(b => b.onclick = () => {
      remove(ref(db, "codes/" + b.dataset.delC));
    });
  }));

  $("#btn-copy-unused").onclick = () => {
    const unused = cachedCodes.filter(([_, d]) => !d.used).map(([c]) => c);
    if (!unused.length) {
      showToast("Kullanılmayan kod bulunmuyor.");
      return;
    }
    navigator.clipboard.writeText(unused.join("\n"));
    showToast(`${unused.length} adet kod panoya kopyalandı!`);
  };
}

// ----------------- BAŞLATMA DÖNGÜSÜ -----------------
onAuthStateChanged(auth, async u => {
  if (!u) return renderLogin();
  try {
    const adminMode = (u.email === ADMIN_EMAIL);
    if (adminMode) {
      return initAppShell(u, true);
    }

    const snap = await get(ref(db, "users/" + u.uid));
    if (!snap.exists()) return renderInvite(u);
    if (snap.val().banned) return renderBanned();

    initAppShell(u, false);
  } catch (err) {
    renderLogin("Bağlantı hatası: " + err.message);
  }
});
